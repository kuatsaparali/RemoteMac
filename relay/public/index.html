<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MacRemote</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/locale.js" defer></script>
  <script src="/audio.js" defer></script>
  <script src="/client.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand"><span class="monitor" aria-hidden="true"></span>MacRemote</div>
      <select id="language" class="language" aria-label="Язык" data-i18n-label="Язык">
        <option value="ru" lang="ru">Русский</option>
        <option value="en" lang="en">English</option>
      </select>
      <div class="tools" id="tools" hidden>
        <button type="button" class="quiet" id="sound" aria-pressed="false" hidden data-i18n>Звук выкл</button>
        <button type="button" class="quiet" id="keyboard" data-i18n aria-pressed="false">Клавиатура</button>
        <button type="button" class="quiet" id="fullscreen" data-i18n aria-pressed="false">На весь экран</button>
        <button type="button" class="stop" id="disconnect" data-i18n>Отключиться</button>
      </div>
    </header>
    <main class="landing" id="landing">
      <section class="connection" aria-labelledby="heading">
        <h1 id="heading" data-i18n>Подключение к Mac</h1>
        <p id="description" data-i18n>Откройте приглашение из MacRemote или вставьте ссылку ниже.</p>
        <form id="form">
          <div id="link-field">
            <label for="invite" data-i18n>Ссылка-приглашение</label>
            <input id="invite" type="url" placeholder="https://…" spellcheck="false" autocomplete="off" inputmode="url" required>
          </div>
          <button class="primary" type="submit" id="connect" data-i18n>Подключиться</button>
        </form>
        <p id="notice" class="notice" role="status" hidden></p>
      </section>
    </main>
    <main class="workspace" id="workspace" hidden>
      <div class="viewport" id="viewport">
        <canvas id="screen" tabindex="0" aria-label="Удалённый экран Mac" data-i18n-label="Удалённый экран Mac" aria-describedby="keyboard-hint"></canvas>
      </div>
      <footer class="session-bar">
        <span class="live"><span aria-hidden="true"></span><b data-i18n>Сеанс открыт</b></span>
        <span class="shortcuts" id="keyboard-hint"><span class="desktop-hint" data-i18n>Щёлкните по экрану для управления. Shift + Esc освобождает клавиатуру.</span><span class="touch-hint" data-i18n>Касание — щелчок. Для ввода нужна физическая клавиатура.</span></span>
        <span class="resolution" id="resolution"></span>
      </footer>
    </main>
  </div>
</body>
</html>
